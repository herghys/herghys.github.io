name: Sync Privacy Policy Manifest

on:
  push:
    branches: [main]
    paths:
      - "PrivacyPolicyCollection/**"
      - "!PrivacyPolicyCollection/policies.json"
      - "!PrivacyPolicyCollection/policies.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate privacy policy manifest
        run: python scripts/generate_privacy_manifest.py

      - name: Commit updated manifest
        run: |
          if [ -z "$(git status --porcelain PrivacyPolicyCollection/policies.json PrivacyPolicyCollection/policies.js)" ]; then
            echo "Manifest is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PrivacyPolicyCollection/policies.json PrivacyPolicyCollection/policies.js
          git commit -m "chore: update privacy policy manifest"
          git push
